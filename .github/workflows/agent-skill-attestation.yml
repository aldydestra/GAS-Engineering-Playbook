name: Agent Skill Signed Attestations

on:
  workflow_dispatch:
  push:
    tags:
      - 'v1.30.*'

permissions:
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  build-attest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild packages and release evidence
        run: |
          python tools/agent_skill_packager.py
          python tools/verify_agent_skill_dist.py
          python tools/evaluate_agent_skill_parity.py
          python tools/build_host_compat.py
          python tools/verify_host_compat.py
          python tools/build_agent_skill_trust.py
          python tools/verify_agent_skill_trust.py
          python tools/build_dual_distribution.py
          python tools/verify_dual_distribution.py
          python tools/build_live_validation.py
          python tools/verify_live_validation.py
      - name: Generate signed GitHub artifact attestations
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/agent-skills-v1.30.1/packages/*.skill
            dist/host-compat-v1.30.1/*.zip
      - name: Upload release evidence
        uses: actions/upload-artifact@v4
        with:
          name: agent-skill-v1.30.1-evidence
          path: |
            dist/agent-skills-v1.30.1/catalog.json
            dist/agent-skills-v1.30.1/security-report.json
            dist/agent-skills-v1.30.1/provenance-index.json
            dist/agent-skills-v1.30.1/provenance/
            dist/agent-skills-v1.30.1/revocations.json
            dist/agent-skills-v1.30.1/SHA256SUMS
            dist/host-compat-v1.30.1/SHA256SUMS
            dist/dual-distribution-v1.30.1/release-index.json
            dist/dual-distribution-v1.30.1/migration-map.json
            dist/dual-distribution-v1.30.1/rollback-drill.json
            dist/dual-distribution-v1.30.1/SHA256SUMS
            dist/live-validation-v1.30.1/manifest.json
            dist/live-validation-v1.30.1/SHA256SUMS
            evidence/live-validation/v1.30.1/
