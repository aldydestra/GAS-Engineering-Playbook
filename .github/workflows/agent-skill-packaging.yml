name: Agent Skill Packaging

on:
  pull_request:
    paths:
      - 'skills/**'
      - 'packaging/agent-skills/**'
      - 'tools/agent_skill_packager.py'
      - 'tools/verify_agent_skill_dist.py'
      - 'tools/test_agent_skill_packaging.py'
      - 'tools/evaluate_agent_skill_parity.py'
      - 'tools/test_agent_skill_evaluation.py'
      - 'evals/agent-skills/**'
      - 'dist/agent-skills-v1.26.0/**'
  push:
    branches: [main]
    paths:
      - 'skills/**'
      - 'packaging/agent-skills/**'
      - 'tools/agent_skill_packager.py'
      - 'tools/verify_agent_skill_dist.py'
      - 'tools/test_agent_skill_packaging.py'
      - 'tools/evaluate_agent_skill_parity.py'
      - 'tools/test_agent_skill_evaluation.py'
      - 'evals/agent-skills/**'
      - 'dist/agent-skills-v1.26.0/**'

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run packaging tests
        run: python -m unittest tools/test_agent_skill_packaging.py -v
      - name: Rebuild all Agent Skill packages
        run: python tools/agent_skill_packager.py
      - name: Verify package archives, coverage, and hashes
        run: python tools/verify_agent_skill_dist.py
      - name: Run evaluation and trigger parity gate
        run: python tools/evaluate_agent_skill_parity.py
      - name: Run evaluation tests
        run: python -m unittest tools/test_agent_skill_evaluation.py -v
      - name: Ensure generated distribution and reports are committed and reproducible
        run: git diff --exit-code -- dist/agent-skills-v1.26.0 reports/agent-skill-evaluation-v1.26.0.json reports/agent-skill-evaluation-v1.26.0.md
