name: Agent Skill Packaging, Trust & Live Validation

on:
  pull_request:
    paths:
      - 'skills/**'
      - 'packaging/**'
      - 'tools/**'
      - 'evals/agent-skills/**'
      - 'evidence/live-validation/v1.30.1/**'
      - 'dist/agent-skills-v1.30.1/**'
      - 'dist/host-compat-v1.30.1/**'
      - 'dist/dual-distribution-v1.30.1/**'
      - 'dist/live-validation-v1.30.1/**'
      - 'reports/agent-skill-evaluation-v1.30.1.*'
      - 'docs/host-compatibility-matrix-v1.30.1.md'
      - 'docs/dual-distribution-rc-v1.30.1.md'
      - 'docs/live-validation-operational-burn-in-v1.30.1.md'
      - 'docs/v2-go-no-go-v1.30.1.md'
  push:
    branches: [main]
    paths:
      - 'skills/**'
      - 'packaging/**'
      - 'tools/**'
      - 'evals/agent-skills/**'
      - 'evidence/live-validation/v1.30.1/**'
      - 'dist/agent-skills-v1.30.1/**'
      - 'dist/host-compat-v1.30.1/**'
      - 'dist/dual-distribution-v1.30.1/**'
      - 'dist/live-validation-v1.30.1/**'
      - 'reports/agent-skill-evaluation-v1.30.1.*'
      - 'docs/host-compatibility-matrix-v1.30.1.md'
      - 'docs/dual-distribution-rc-v1.30.1.md'
      - 'docs/live-validation-operational-burn-in-v1.30.1.md'
      - 'docs/v2-go-no-go-v1.30.1.md'

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run packaging tests
        run: python -m unittest tools/test_agent_skill_packaging.py -v
      - name: Rebuild all Agent Skill packages
        run: python tools/agent_skill_packager.py
      - name: Verify package archives, coverage, and hashes
        run: python tools/verify_agent_skill_dist.py
      - name: Run evaluation and trigger parity gate
        run: python tools/evaluate_agent_skill_parity.py
      - name: Run evaluation tests
        run: python -m unittest tools/test_agent_skill_evaluation.py -v
      - name: Build host compatibility adapters
        run: python tools/build_host_compat.py
      - name: Verify host compatibility adapters
        run: python tools/verify_host_compat.py
      - name: Run host compatibility tests
        run: python -m unittest tools/test_host_compat.py -v
      - name: Build security, catalog, provenance and revocation evidence
        run: python tools/build_agent_skill_trust.py
      - name: Verify trust catalog and provenance
        run: python tools/verify_agent_skill_trust.py
      - name: Run trust/revocation tests
        env:
          PYTHONPATH: tools
        run: python tools/test_agent_skill_trust.py
      - name: Build dual-distribution RC evidence
        run: python tools/build_dual_distribution.py
      - name: Verify dual-distribution migration and rollback evidence
        run: python tools/verify_dual_distribution.py
      - name: Run dual-distribution tests
        env:
          PYTHONPATH: tools
        run: python -m unittest tools/test_dual_distribution.py -v
      - name: Build fail-closed live-validation evidence
        run: python tools/build_live_validation.py
      - name: Verify live-validation gate
        run: python tools/verify_live_validation.py
      - name: Test live-validation semantics
        run: python -m unittest tools/test_live_validation.py tools/test_live_execution.py -v
      - name: Ensure generated distributions and reports are committed and reproducible
        run: >-
          git diff --exit-code --
          dist/agent-skills-v1.30.1
          dist/host-compat-v1.30.1
          dist/dual-distribution-v1.30.1
          dist/live-validation-v1.30.1
          reports/agent-skill-evaluation-v1.30.1.json
          reports/agent-skill-evaluation-v1.30.1.md
          docs/host-compatibility-matrix-v1.30.1.md
          docs/dual-distribution-rc-v1.30.1.md
          docs/live-validation-operational-burn-in-v1.30.1.md
          docs/v2-go-no-go-v1.30.1.md
